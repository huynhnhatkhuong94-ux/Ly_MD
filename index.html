body{margin:0;font:14px system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}

button.danger{background:#fceaea;color:var(--red)}
button:disabled{opacity:.45;cursor:not-allowed}
input,select{padding:10px 12px;border:1px solid #dfd7d0;border-radius:9px;background:#fff;max-width:100%;width:100%}

.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 10%,#f2e1d0,transparent 40%),var(--bg)}
.loginbox{width:min(420px,100%);background:white;padding:34px;border-radius:20px;box-shadow:0 15px 60px #6b4a3017}
.brand{font-family:Georgia,serif;font-size:30px;color:#8f654c}
.sub{color:var(--muted);margin:8px 0 24px}
.field{display:grid;gap:6px;margin:12px 0}
.hint{font-size:12px;color:var(--muted);line-height:1.6}

.shell{display:flex;min-height:100vh}
.sidebar{width:244px;background:#322c2a;color:#f7f1eb;padding:24px 13px;flex-shrink:0;transition:width 0.3s ease;position:relative}
.sidebar.collapsed{width:70px !important;padding:24px 8px !important}
.sidebar.collapsed .brand-text, .sidebar.collapsed .nav-text{display:none !important}
.sidebar.collapsed .nav{text-align:center;padding:12px 6px;justify-content:center}
.brand-container{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px;gap:5px}
.sidebar.collapsed .brand-container{justify-content:center}
.collapse-btn{background:#4a3d38;color:#fff;border:none;border-radius:6px;padding:5px 8px;cursor:pointer;font-size:11px;flex-shrink:0}
.collapse-btn:hover{background:#6b5850}

.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;color:#e9ded5;margin:3px 0;padding:12px;white-space:nowrap;overflow:hidden}
.nav.active,.nav:hover{background:#594b43}

.main{flex:1;min-width:0;padding:28px;max-width:1600px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:25px}
h1{font-size:25px;margin:0}h2{font-size:18px;margin:0 0 15px}h3{font-size:15px;margin:0 0 12px}
.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}
.card,.box{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:20px}
.card b{display:block;font-size:24px;margin-top:12px}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-top:16px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 15px}
.tablewrap{overflow:auto}
table{border-collapse:collapse;width:100%;min-width:650px}
th,td{padding:12px;text-align:left;border-bottom:1px solid var(--line)}
th{color:#8a7768;font-weight:600;background:#fcfaf8}
td button{padding:7px 10px;margin:2px}
.tag{display:inline-block;background:#f5e9dd;color:#916545;border-radius:99px;padding:5px 9px;font-size:12px}

.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.formgrid .field{margin:0}.full{grid-column:1/-1}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.overlay{position:fixed;inset:0;background:#221a17a6;display:grid;place-items:center;padding:16px;z-index:10}
.modal{background:white;width:min(620px,100%);max-height:92vh;overflow:auto;border-radius:16px;padding:24px}
.modal header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.modal header button{background:#f2ece7;color:#45352d}
.empty{text-align:center;padding:35px;color:var(--muted)}
.pill{border:1px solid var(--line);border-radius:10px;padding:10px}
.line{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:9px 0}
.small{font-size:12px}.hide{display:none!important}

@media(max-width:1050px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}

  // 1. Kiểm tra quyền của user hiện tại khi vừa vào trang
async function checkUserAccessAndInit() {
  const { data: { user }, error: authError } = await supabase.auth.getUser();
  
  if (authError || !user) {
    // Chưa đăng nhập -> Chuyển về trang đăng nhập
    window.location.href = 'login.html'; 
    return;
  }

  // Lấy thông tin role từ bảng profiles
  const { data: profile, error: profileError } = await supabase
    .from('profiles')
    .select('role, full_name')
    .eq('id', user.id)
    .single();

  if (profileError || !profile) {
    console.error('Không tìm thấy thông tin profile');
    return;
  }

  // Phân quyền hiển thị UI
  if (profile.role === 'admin') {
    // Hiển thị các khu vực dành riêng cho Admin
    document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
    loadAllUsersForAdmin(); // Tải danh sách nhân sự để quản lý
  } else {
    // Ẩn khu vực Admin với nhân viên thông thường
    document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
  }
}

// 2. Tải danh sách user cho Admin quản lý
async function loadAllUsersForAdmin() {
  const { data: profiles, error } = await supabase
    .from('profiles')
    .select('*')
    .order('created_at', { ascending: false });

  if (error) {
    alert('Lỗi tải danh sách người dùng: ' + error.message);
    return;
  }

  const tbody = document.getElementById('users-list-body');
  tbody.innerHTML = '';

  profiles.forEach(p => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${p.email || 'Chưa cập nhật'}</td>
      <td>${p.full_name || 'N/A'}</td>
      <td>
        <select id="role-${p.id}" onchange="updateUserRole('${p.id}')">
          <option value="staff" ${p.role === 'staff' ? 'selected' : ''}>Nhân viên (Staff)</option>
          <option value="manager" ${p.role === 'manager' ? 'selected' : ''}>Quản lý (Manager)</option>
          <option value="admin" ${p.role === 'admin' ? 'selected' : ''}>Quản trị viên (Admin)</option>
        </select>
      </td>
      <td><span id="status-${p.id}" style="color: green; font-size: 12px;"></span></td>
    `;
    tbody.appendChild(tr);
  });
}

// 3. Hàm cập nhật vai trò khi Admin đổi giá trị trong thẻ <select>
async function updateUserRole(userId) {
  const selectedRole = document.getElementById(`role-${userId}`).value;
  const statusSpan = document.getElementById(`status-${userId}`);

  const { error } = await supabase
    .from('profiles')
    .update({ role: selectedRole })
    .eq('id', userId);

  if (error) {
    statusSpan.style.color = 'red';
    statusSpan.textContent = 'Lỗi cập nhật!';
    console.error(error);
  } else {
    statusSpan.style.color = 'green';
    statusSpan.textContent = 'Đã lưu!';
    setTimeout(() => { statusSpan.textContent = ''; }, 2000);
  }
}

function allowed(k){
  if(!user)return false;
  if(user.role==='owner')return true;
  return ['calendar','customers','products_services'].includes(k);
}

function id(){return Date.now()*1000+Math.floor(Math.random()*1000)}
function sj(v){return JSON.stringify(v,(k,x)=>x&&typeof x==='object'&&!Array.isArray(x)?Object.keys(x).sort().reduce((o,n)=>(o[n]=x[n],o),{}):x)}
function save(){
  const now={},ups=[],dels={};
  COLS.forEach(c=>(db[c]||[]).forEach(x=>{const k=c+':'+x.id,j=sj(x);now[k]=j;if(snap[k]!==j)ups.push({collection:c,id:x.id,data:x})}));
  const cj=sj(db.calendarConfig);now['config:1']=cj;
  if(snap['config:1']!==cj)ups.push({collection:'config',id:1,data:db.calendarConfig});
  Object.keys(snap).forEach(k=>{if(!(k in now)){const [c,i]=k.split(':');(dels[c]=dels[c]||[]).push(Number(i))}});
  snap=now;
  if(!ups.length&&!Object.keys(dels).length)return;
  pushQ=pushQ.then(async()=>{
    if(ups.length){const r=await sb.from('records').upsert(ups);if(r.error)throw r.error}
    for(const c in dels){const r=await sb.from('records').delete().eq('collection',c).in('id',dels[c]);if(r.error)throw r.error}
  }).catch(e=>alert('Lỗi đồng bộ: '+(e.message||e)+'\nHãy tải lại trang (F5) để lấy dữ liệu mới nhất.'));
}
async function loadAll(){
  db=emptyDb();snap={};let from=0,rows=[];
  for(;;){
    const {data,error}=await sb.from('records').select('collection,id,data').order('collection').order('id').range(from,from+999);
    if(error)throw error;rows=rows.concat(data);if(data.length<1000)break;from+=1000;
  }
  rows.forEach(r=>{
    if(r.collection==='config')db.calendarConfig=r.data;else if(COLS.includes(r.collection))db[r.collection].push(r.data);
    snap[r.collection+':'+r.id]=sj(r.data);
  });
}
function subscribe(){
  if(chan)sb.removeChannel(chan);
  chan=sb.channel('records-sync').on('postgres_changes',{event:'*',schema:'public',table:'records'},applyRemote).subscribe();
}
function applyRemote(p){
  const r=p.eventType==='DELETE'?p.old:p.new,c=r.collection,i=Number(r.id),k=c+':'+i;
  if(p.eventType==='DELETE'){
    if(!(k in snap))return;delete snap[k];
    if(COLS.includes(c))db[c]=db[c].filter(x=>x.id!==i);
  }else{
    if(snap[k]===sj(r.data))return;snap[k]=sj(r.data);
    if(c==='config')db.calendarConfig=r.data;
    else if(COLS.includes(c)){const a=db[c],ix=a.findIndex(x=>x.id===i);if(ix>=0)a[ix]=r.data;else a.push(r.data)}
  }
  softRender();
}
function softRender(){
  clearTimeout(rt);
  rt=setTimeout(()=>{
    const ae=document.activeElement,busy=document.querySelector('#modalRoot .modal')||/INPUT|SELECT|TEXTAREA/.test(ae&&ae.tagName||'')||($('#calEditor')&&$('#calEditor').innerHTML.trim());
    if(user&&!busy)render();
  },400);
}
async function enter(u){
  try{
    const {data:p,error}=await sb.from('profiles').select('name,role').eq('id',u.id).maybeSingle();
    if(error)throw error;
    if(!p||!p.role){await sb.auth.signOut();user=null;render();alert('Tài khoản chưa được cấp quyền. Hãy liên hệ admin.');return}
    user={id:u.id,name:p.name||u.email,role:p.role==='admin'?'owner':'staff'};
    await loadAll();subscribe();
    view=allowed('dashboard')?'dashboard':Object.keys(menuItems).find(allowed);
    render();
  }catch(e){user=null;render();alert('Không tải được dữ liệu: '+(e.message||e))}
}
async function login(){

  await enter(data.user);
}
async function logout(){

<div id="admin-panel" class="admin-only" style="display: none; padding: 20px;">

function go(k){if(!allowed(k))return;view=k;cart=[];render()}
function table(head,rows){return `<div class="tablewrap"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${head.length}" class="empty">Chưa có dữ liệu</td></tr>`}</tbody></table></div>`}

function summary(){

  return {revenue,cogs,exp,profit:revenue-cogs-exp,low:db.products.filter(x=>x.stock<=x.min).length}
}

function modal(title,body,submit){
  $('#modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><header><h2>${title}</h2><button onclick="closeModal()">✕</button></header><form id="modalForm">${body}<div class="actions"><button type="submit">${submit||'Lưu'}</button><button type="button" class="secondary" onclick="closeModal()">Hủy</button></div></form></div></div>`
}
function closeModal(){$('#modalRoot').innerHTML=''}
function f(label,name,value='',type='text',extra=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${extra} required></div>`}
function val(form,name){return form.elements.namedItem(name).value}
function num(form,name){return Number(val(form,name))}
function submitModal(fn){
  $('#modalForm').onsubmit=e=>{
    e.preventDefault();
    try{fn(e.target);save();closeModal();render()}catch(err){alert(err.message)}
  }
}

    if (!keyword) return true;
    return (x.name || '').toLowerCase().includes(keyword) || (x.phone || '').includes(keyword);
  });

  const rows = filteredList.map(x => {
    const visits = db.sales.filter(s => 
      s.customer && s.customer.toLowerCase().trim() === x.name.toLowerCase().trim()
    ).length;

    const visitBadge = visits > 0 
      ? `<span class="tag" style="background:#e4f4e9; color:#238267; font-weight:bold;">${visits} lần ghé</span>`
      : `<span class="tag" style="background:#f5f5f5; color:#888;">0 lần</span>`;

    return `<tr style="cursor:pointer;" ondblclick="editCustomer(${x.id})" title="Nhấp đúp để xem chi tiết & chỉnh sửa">
      <td><b>${esc(x.name)}</b></td>
      <td>${esc(x.phone || '—')}</td>
      <td>${esc(x.note || '—')}</td>

          <input id="customerSearchInput" placeholder="🔍 Tìm theo tên hoặc SĐT khách..." value="${esc(customerFilterKeyword)}" oninput="customerFilterKeyword=this.value; customers()">

function editCustomer(i){
  const x = db.customers.find(z => z.id === i) || { name: '', phone: '', note: '' };
  let customerSales = [];
  if (x.name) {
    customerSales = db.sales.filter(s => 
      (s.customer && s.customer.toLowerCase().trim() === x.name.toLowerCase().trim())
    );
  }

  let historyHtml = '<div style="margin-top:15px; border-top:1px solid #eee; padding-top:10px;">';
  historyHtml += '<h3 style="margin-bottom:10px; color:var(--gold);">📜 Lịch sử chốt đơn / mua hàng</h3>';
  
  if (customerSales.length === 0) {
    historyHtml += '<p class="muted small">Khách hàng chưa có lịch sử hóa đơn nào.</p>';
  } else {
    historyHtml += '<div style="max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;">';
    customerSales.forEach((s, idx) => {
      historyHtml += `
        <div style="background: #faf6f0; border: 1px solid #eee; border-radius: 8px; padding: 10px;">
          <div style="display:flex; justify-content:space-between; font-weight:bold; margin-bottom:5px;">
            <span>Lần ${idx + 1}: Mã HD${s.id}</span>
            <span class="small muted">${date(s.at)}</span>
          </div>
          <ul style="margin: 0; padding-left: 18px; font-size: 13px;">
            ${(s.items || []).map(it => `
              <li><b>${esc(it.name)}</b> x ${it.qty} — <span style="color:var(--gold);">${money(it.price * it.qty)}</span> (${it.type === 'product' ? 'Mỹ phẩm' : 'Dịch vụ'})</li>
            `).join('')}
          </ul>
          <div style="text-align:right; font-weight:bold; margin-top:5px; font-size:13px;">
            Tổng tiền: ${money(s.total)}
          </div>
        </div>
      `;
    });
    historyHtml += '</div>';
  }
  historyHtml += '</div>';

  modal(i ? 'Thông tin & Lịch sử Khách hàng' : 'Thêm khách hàng', `
    <div class="field"><label>Họ tên</label><input name="name" value="${esc(x.name)}" required></div>
    <div class="field"><label>Số điện thoại</label><input name="phone" value="${esc(x.phone)}"></div>
    <div class="field"><label>Ghi chú</label><input name="note" value="${esc(x.note)}"></div>
    ${i ? historyHtml : ''}

  submitModal(t => {
    const v = { name: val(t, 'name'), phone: val(t, 'phone'), note: val(t, 'note') };
    if (i) Object.assign(x, v);
    else db.customers.push({ id: id(), ...v });

function addCart(){
  const itemSelect = $('#saleItem');
  const customInput = $('#saleCustomName');
  const qty = Number($('#saleQty').value);

  if (!Number.isInteger(qty) || qty <= 0) return alert('Số lượng phải là số nguyên dương');

  let idVal, name, price, cost = 0, type = saleType || 'product';

  if (customInput && customInput.value.trim() !== '') {
    name = customInput.value.trim();
    const customPrice = Number($('#saleCustomPrice').value);
    if (isNaN(customPrice) || customPrice < 0) return alert('Giá tiền không hợp lệ');
    price = customPrice;
    idVal = 'custom_' + Date.now();
  } else {
    const itemId = Number(itemSelect.value);
    const list = type === 'product' ? db.products : db.services;
    const x = list.find(z => z.id === itemId);
    if (!x) return alert('Vui lòng chọn mặt hàng');
    idVal = x.id;
    name = x.name;
    price = x.price;
    cost = x.cost || 0;

    if (type === 'product' && qty > x.stock) {
      return alert('Không đủ tồn kho cho sản phẩm: ' + name);
    }
  }

  const existing = cart.find(z => z.type === type && z.id === idVal);
  if (existing) {
    let newQty = qty + existing.qty;
    if (type === 'product' && !String(idVal).startsWith('custom_')) {
      const prod = db.products.find(p => p.id === idVal);
      if (prod && newQty > prod.stock) return alert('Vượt quá số lượng tồn kho');
    }
    existing.qty = newQty;
  } else {
    cart.push({ type, id: idVal, name, price, cost, qty });
  }

  if (customInput) customInput.value = '';
  if ($('#saleCustomPrice')) $('#saleCustomPrice').value = '0';

  cartRender();
}

function cartRender(){
  const e=$('#cartArea');if(!e)return;
  e.innerHTML=cart.map((x,i)=>`<div class="pill line"><div>${esc(x.name)}<div class="muted small">${x.qty} × ${money(x.price)} (${x.type==='product'?'Mỹ phẩm':'Dịch vụ'})</div></div><div><b>${money(x.qty*x.price)}</b> <button class="danger" onclick="cart.splice(${i},1);cartRender()">✕</button></div></div>`).join('')||'<p class="muted">Chưa có sản phẩm hoặc dịch vụ.</p>';
  e.innerHTML+=`<hr style="border:0;border-top:1px solid #eee"><div class="line"><b>Tổng thanh toán</b><h2>${money(cart.reduce((s,x)=>s+x.price*x.qty,0))}</h2></div><button style="width:100%" ${!cart.length?'disabled':''} onclick="checkout()">Hoàn tất thanh toán</button>`;
}

function checkout(){
  if(!cart.length)return;
  for(const x of cart){
    if(x.type==='product' && !String(x.id).startsWith('custom_')){
      const prod = db.products.find(p=>p.id===x.id);
      if(prod && prod.stock < x.qty) return alert('Không đủ tồn kho: '+x.name);
    }
  }

  const customerInput = $('#saleCustomer');
  const customer = customerInput ? (customerInput.value.trim() || 'Khách lẻ') : 'Khách lẻ';

  if (customer !== 'Khách lẻ' && !db.customers.some(c => c.name.toLowerCase() === customer.toLowerCase())) {
    db.customers.push({ id: id(), name: customer, phone: '', note: 'Thêm nhanh từ bán hàng' });
  }

  const items=cart.map(x=>({...x}));
  for(const x of items){
    if(x.type==='product' && !String(x.id).startsWith('custom_')){
      const prod = db.products.find(p=>p.id===x.id);
      if(prod){
        prod.stock -= x.qty;
        db.stockMoves.push({id:id(),at:today(),product:x.name,type:'sale',qty:-x.qty,by:user.name});
      }
    }
  }

  const sale={id:id(),at:today(),customer,items,total:items.reduce((s,x)=>s+x.price*x.qty,0),cost:items.reduce((s,x)=>s+x.cost*x.qty,0),by:user.name};
  db.sales.push(sale);
  save();
  cart=[];
  alert('Đã tạo hóa đơn HD'+sale.id+' • '+money(sale.total));
  render();
}

function stock(){
  $('#content').innerHTML=`<div class="box"><div class="toolbar"><h2>Nhập / điều chỉnh tồn</h2>${['owner','manager'].includes(user.role)?'<button onclick="stockModal()">+ Tạo phiếu kho</button>':'<span class="muted">Chỉ quản lý được lập phiếu kho</span>'}</div>${table(['Ngày','Sản phẩm','Loại','Số lượng','Người tạo'],db.stockMoves.slice().reverse().map(x=>`<tr><td>${date(x.at)}</td><td>${esc(x.product)}</td><td>${x.type==='in'?'Nhập kho':x.type==='sale'?'Bán hàng':'Điều chỉnh'}</td><td class="${x.qty<0?'bad':'good'}">${x.qty>0?'+':''}${x.qty}</td><td>${esc(x.by)}</td></tr>`))}</div>`
}
function stockModal(){
  if(!['owner','manager'].includes(user.role))return;
  modal('Tạo phiếu nhập / xuất kho',`<div class="field"><label>Sản phẩm</label><select name="product">${db.products.map(x=>`<option value="${x.id}">${esc(x.name)} (tồn ${x.stock})</option>`).join('')}</select></div><div class="field"><label>Loại phiếu</label><select name="type"><option value="in">Nhập kho</option><option value="out">Xuất điều chỉnh</option></select></div>${f('Số lượng','qty',1,'number','min="1" step="1"')}`);
  submitModal(t=>{
    const p=db.products.find(x=>x.id===num(t,'product')),q=num(t,'qty'),type=val(t,'type');
    if(!p||!Number.isInteger(q)||q<=0)throw Error('Số lượng không hợp lệ');
    if(type==='out'&&p.stock<q)throw Error('Không đủ tồn kho');
    const delta=type==='in'?q:-q;p.stock+=delta;
    db.stockMoves.push({id:id(),at:today(),product:p.name,type,qty:delta,by:user.name});
  });
}

function download(name,content,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportCSV(){const rows=[['Mã','Ngày','Khách','Doanh thu','Giá vốn','Người tạo'],...db.sales.map(x=>['HD'+x.id,x.at,x.customer,x.total,x.cost,x.by])];download('hoa_don_spa.csv','\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8')}

function userModal(i){
  const x=db.users.find(z=>z.id===i)||{name:'',username:'',password:'123456',role:'staff',active:true};
  modal(i?'Sửa tài khoản':'Thêm tài khoản',`${f('Họ tên','name',x.name)}${f('Tên đăng nhập','username',x.username)}${f('Mật khẩu','password',x.password)}<div class="field"><label>Vai trò</label><select name="role">${Object.entries(roleName).map(([k,v])=>`<option value="${k}" ${x.role===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Trạng thái</label><select name="active"><option value="1" ${x.active?'selected':''}>Hoạt động</option><option value="0" ${!x.active?'selected':''}>Khóa</option></select></div>`);
  submitModal(t=>{
    const v={name:val(t,'name'),username:val(t,'username'),password:val(t,'password'),role:val(t,'role'),active:val(t,'active')==='1'};
    if(db.users.some(z=>z.username===v.username&&z.id!==i))throw Error('Tên đăng nhập đã tồn tại');
    if(i===user.id&&(!v.active||v.role!=='owner'))throw Error('Không thể tự khóa hoặc bỏ quyền chủ Spa');
    if(i)Object.assign(x,v);else db.users.push({id:id(),...v});
  });
}

function backup(){
  $('#content').innerHTML=`<div class="box"><h2>Sao lưu / khôi phục</h2><div class="actions"><button onclick="backupNow()">Tải file sao lưu JSON</button><label class="pill">Khôi phục JSON <input type="file" accept=".json,application/json" onchange="restore(event)" style="max-width:230px"></label></div></div>`
}
function backupNow(){download('ly_md_beauty_backup_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db,null,2),'application/json')}
function restore(e){
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      if(!Array.isArray(data.products)||!Array.isArray(data.sales))throw Error('File không đúng cấu trúc');
      if(!confirm('Ghi đè toàn bộ dữ liệu hiện tại bằng bản sao lưu?'))return;
      db=Object.assign(emptyDb(),data);save();render();alert('Khôi phục thành công.');
    }catch(err){alert('Không thể khôi phục: '+err.message)}
  };
  r.readAsText(file);
}
function resetDemo(){if(!confirm('Xóa toàn bộ dữ liệu hiện tại và trở về dữ liệu mẫu?'))return;db=initial();save();logout()}

// Cấu hình Lịch hẹn
const calStyle=document.createElement('style');
calStyle.textContent=`.calhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}.calgrid{display:grid;grid-template-columns:95px repeat(6,minmax(130px,1fr));gap:5px;min-width:960px}.calcell{background:#fff;border:1px solid #eadfd5;border-radius:9px;padding:8px;min-height:125px}.calcell.cal-full{background:#fff1f1;border-color:#e88}.calcell.drop{outline:3px solid #b88c5c}.calday{background:#f4ece3;min-height:auto;font-weight:bold;text-align:center}.calshift{background:#f9f2eb;font-weight:700}.appointment{padding:7px;margin:5px 0;border-radius:8px;background:#f1e7fa;border-left:4px solid #9273b6;font-size:12px;cursor:grab}.appointment.done{background:#e4f4e9;border-color:#3b9560}.appointment.cancel{opacity:.5}.calwrap{overflow-x:auto}.calform{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px}.calform label{font-size:13px}.calform input,.calform select{width:100%;margin-top:5px}.calbadge{color:#b32828;font-weight:700}.calcell button{padding:4px 8px;font-size:12px}`;
document.head.appendChild(calStyle);

if(!Array.isArray(db.appointments))db.appointments=[];
if(!db.calendarConfig)db.calendarConfig={morning:'08:00',afternoon:'13:00',max:4};
let weekOffset=0,editAppointment=null;

function isoLocal(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function monday(offset=0){let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7)+offset*7);return d}
function calDate(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return isoLocal(x)}
function calCount(date,shift,ignore){return db.appointments.filter(a=>a.date===date&&a.shift===shift&&a.status!=='cancel'&&a.id!==ignore).length}
function calConflict(a,ignore){
  if(new Date(a.date+'T12:00:00').getDay()===0)return 'Chủ nhật nghỉ, không nhận lịch.';
  if(calCount(a.date,a.shift,ignore)>=Number(db.calendarConfig.max))return 'Ca này đã FULL. Hãy chọn ngày hoặc ca khác.';
  if(db.appointments.some(x=>x.id!==ignore&&x.status!=='cancel'&&x.date===a.date&&x.shift===a.shift&&Number(x.customerId)===Number(a.customerId)))return 'Khách đã có lịch trong ca này.';
  if(a.staff&&db.appointments.some(x=>x.id!==ignore&&x.status!=='cancel'&&x.date===a.date&&x.shift===a.shift&&x.staff===a.staff))return 'Nhân viên này đã có lịch trong ca này.';
  return '';
}

function calendarPage(){
  let mon=monday(weekOffset),end=calDate(mon,5),max=Number(db.calendarConfig.max);
  $('#content').innerHTML=`<div class="box"><div class="calhead"><div><h2>📅 Lịch làm việc • ${calDate(mon,0)} → ${end}</h2><p class="muted">Thứ 2–Thứ 7 • Chủ nhật nghỉ • Kéo thả thẻ lịch để đổi ngày/ca</p></div><div><button class="secondary" onclick="weekOffset--;calendarPage()">← Tuần trước</button> <button class="secondary" onclick="weekOffset=0;calendarPage()">Tuần này</button> <button class="secondary" onclick="weekOffset++;calendarPage()">Tuần sau →</button></div></div><div class="calwrap"><div class="calgrid"><div class="calcell calday">Ca / Ngày</div>${Array.from({length:6},(_,i)=>`<div class="calcell calday">${['Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7'][i]}<br>${calDate(mon,i)}</div>`).join('')}${['morning','afternoon'].map(sh=>`<div class="calcell calshift">${sh==='morning'?'☀️ Sáng':'🌤️ Chiều'}<br><small>${db.calendarConfig[sh]}</small></div>${Array.from({length:6},(_,i)=>{let dt=calDate(mon,i),items=db.appointments.filter(a=>a.date===dt&&a.shift===sh&&a.status!=='cancel'),full=items.length>=max;return `<div class="calcell ${full?'cal-full':''}" ondragover="event.preventDefault();this.classList.add('drop')" ondragleave="this.classList.remove('drop')" ondrop="calDrop(event,'${dt}','${sh}')"><div class="muted small">${items.length}/${max} ${full?'<span class="calbadge">FULL</span>':''}</div>${items.map(a=>{let c=db.customers.find(x=>x.id===Number(a.customerId)),sv=db.services.find(x=>x.id===Number(a.serviceId));return `<div class="appointment ${a.status==='done'?'done':''}" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${a.id}')" onclick="calEdit(${a.id})"><b>${esc(c?.name||'Khách đã xóa')}</b><br>${esc(sv?.name||'Dịch vụ')}<br>Buổi ${a.session}/${a.total} · ${esc(a.staff||'Chưa phân công')}${a.status==='done'?' ✓':''}</div>`}).join('')}</div>`}).join('')}`).join('')}</div></div></div><div class="box" id="calEditor"></div><div class="box"><h2>⚙️ Cấu hình lịch</h2><div class="calform"><label>Giờ ca sáng<input type="time" id="calMorning" value="${db.calendarConfig.morning}"></label><label>Giờ ca chiều<input type="time" id="calAfternoon" value="${db.calendarConfig.afternoon}"></label><label>Số khách tối đa / ca<input type="number" id="calMax" min="1" max="100" value="${max}"></label></div><p><button class="secondary" onclick="calSaveConfig()">Lưu cấu hình</button></p></div>`;
  calNew(calDate(mon,0),'morning');
}

function calNew(date,shift){editAppointment=null;calForm({date,shift,session:1,total:4,status:'booked'})}
function calEdit(id){let a=db.appointments.find(x=>x.id===id);if(!a)return;editAppointment=id;calForm(a)}
function calForm(a){
  let el=$('#calEditor');if(!el)return;
  el.innerHTML=`<h2>${editAppointment?'Sửa lịch hẹn':'Đặt lịch / Tạo buổi liệu trình'}</h2><div class="calform"><label>Khách hàng<input id="calCustomer" list="calCustomerList" placeholder="Chọn hoặc nhập tên khách" value="${esc(db.customers.find(c=>c.id===Number(a.customerId))?.name||a.customerName||'')}"><datalist id="calCustomerList">${db.customers.map(c=>`<option value="${esc(c.name)}">${esc(c.phone||'')}</option>`).join('')}</datalist></label><label>Dịch vụ<select id="calService">${db.services.map(s=>`<option value="${s.id}" ${Number(a.serviceId)===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label><label>Ngày hẹn<input id="calWhen" type="date" value="${a.date}"></label><label>Ca<select id="calShift"><option value="morning" ${a.shift==='morning'?'selected':''}>Sáng</option><option value="afternoon" ${a.shift==='afternoon'?'selected':''}>Chiều</option></select></label><label>Người phụ trách<select id="calStaff"><option value="">Chưa phân công</option>${['BS Ly','BS Huy'].map(n=>`<option value="${n}" ${a.staff===n?'selected':''}>${n}</option>`).join('')}</select></label><label>Buổi số<input id="calSession" type="number" min="1" value="${a.session||1}"></label><label>Tổng số buổi<input id="calTotal" type="number" min="1" value="${a.total||4}"></label><label>Trạng thái<select id="calStatus"><option value="booked" ${a.status==='booked'?'selected':''}>Đã đặt</option><option value="done" ${a.status==='done'?'selected':''}>Hoàn thành</option><option value="cancel" ${a.status==='cancel'?'selected':''}>Hủy</option></select></label><label>Ghi chú<input id="calNote" value="${esc(a.note||'')}"></label></div><p><button onclick="calSave()">${editAppointment?'Lưu thay đổi':'Lưu lịch hẹn'}</button> ${editAppointment?'<button class="danger" onclick="calRemove()">Xóa lịch</button>':''} <button class="secondary" onclick="calPlan()">Tạo nhiều buổi tự động</button></p>`;
}

function calResolveCustomer(create){
  let name=$('#calCustomer').value.trim();if(!name)return 0;
  let found=db.customers.find(c=>c.name.toLocaleLowerCase('vi')===name.toLocaleLowerCase('vi'));
  if(found)return found.id;
  if(!create)return -1;
  let customer={id:id(),name,phone:'',note:'Được thêm từ lịch hẹn'};
  db.customers.push(customer);return customer.id;
}
function calPrepareCustomer(a){if(a.customerId===-1){a.customerId=calResolveCustomer(true)}return a}
function calValues(){return {customerId:calResolveCustomer(false),serviceId:Number($('#calService').value),date:$('#calWhen').value,shift:$('#calShift').value,staff:$('#calStaff').value,session:Number($('#calSession').value),total:Number($('#calTotal').value),status:$('#calStatus').value,note:$('#calNote').value}}

function calSave(){
  let a=calValues();if(!a.customerId||!a.serviceId||!a.date||a.session<1||a.total<a.session)return alert('Kiểm tra khách hàng, dịch vụ và số buổi.');
  calPrepareCustomer(a);
  let err=a.status==='cancel'?'':calConflict(a,editAppointment);
  if(err)return alert('⚠️ '+err);
  if(editAppointment){Object.assign(db.appointments.find(x=>x.id===editAppointment),a)}else db.appointments.push({...a,id:id()});
  save();calendarPage();
}
function calRemove(){if(!confirm('Xóa lịch hẹn này?'))return;db.appointments=db.appointments.filter(a=>a.id!==editAppointment);save();calendarPage()}
function calDrop(e,date,shift){
  e.preventDefault();let id=Number(e.dataTransfer.getData('text/plain')),a=db.appointments.find(x=>x.id===id);if(!a)return;
  let next={...a,date,shift},err=calConflict(next,id);if(err)return alert('⚠️ '+err);
  a.date=date;a.shift=shift;save();calendarPage();
}
function calSaveConfig(){
  let max=Number($('#calMax').value);if(max<1||max>100)return alert('Sức chứa phải từ 1–100');
  db.calendarConfig={morning:$('#calMorning').value,afternoon:$('#calAfternoon').value,max};save();calendarPage();
}
function calPlan(){
  let a=calValues();if(!a.customerId||!a.serviceId||!a.date||a.total<a.session)return alert('Kiểm tra dữ liệu liệu trình');
  let gap=Number(prompt('Số ngày nghỉ giữa 2 buổi (1 = thứ 2 → thứ 4; 2 = thứ 2 → thứ 5):','1'));
  if(!Number.isInteger(gap)||gap<1||gap>365)return;
  calPrepareCustomer(a);let created=0,skipped=[];
  let d=new Date(a.date+'T12:00:00');if(d.getDay()===0)d.setDate(d.getDate()+1);
  for(let n=a.session;n<=a.total;n++){
    if(n>a.session){d.setDate(d.getDate()+gap+1);if(d.getDay()===0)d.setDate(d.getDate()+1)}
    let item={...a,date:isoLocal(d),session:n,status:'booked'};
    let err=calConflict(item,null);
    if(err){skipped.push(`Buổi ${n} (${item.date}): ${err}`);continue}
    db.appointments.push({...item,id:id()});created++;
  }
  save();calendarPage();alert(`Đã tạo ${created} buổi.`);
}

(async()=>{
  const box=t=>`<div class="login"><div class="loginbox">${t}</div></div>`;
  if(!window.supabase||SUPABASE_URL.startsWith('DÁN')){$('#app').innerHTML=box('<h2>Chưa cấu hình</h2><p class="hint">Mở file bằng Notepad, dán Project URL và anon key của Supabase vào 2 dòng đầu của thẻ script.</p>');return}
  $('#app').innerHTML=box('Đang tải…');
  sb=supabase.createClient(SUPABASE_URL.trim().replace(/(https?:\/\/[^\/]+).*/,'$1'),SUPABASE_KEY.trim());
  const {data}=await sb.auth.getSession();
  if(data.session)await enter(data.session.user);else render();
})();
</script>
